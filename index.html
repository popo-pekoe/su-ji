<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数字おぼえゲーム</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* スマホでの誤タップやズームを防ぐスタイル */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* 回転用のクラス */
    .rotate-180 {
      transform: rotate(180deg);
    }
    /* ピョコッと飛び出すアニメーション */
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* ガチャーンと上から降ってくるアニメーション */
    @keyframes dropSlot {
      0% { transform: translateY(-250px) scaleY(1.4); opacity: 0; }
      55% { transform: translateY(15px) scaleY(0.85); opacity: 1; }
      75% { transform: translateY(-8px) scaleY(1.1); }
      100% { transform: translateY(0) scaleY(1); opacity: 1; }
    }
    .animate-drop-slot {
      animation: dropSlot 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* ガチャーンの瞬間の衝撃波リング */
    @keyframes shockwave {
      0% { transform: scale(0.7); opacity: 1; border-width: 8px; }
      100% { transform: scale(1.5); opacity: 0; border-width: 1px; }
    }
    .animate-shockwave {
      animation: shockwave 0.4s ease-out forwards;
    }

    /* パステルフォーカス用の柔らかい発光アニメーション */
    @keyframes pastelFocusNum {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.5); }
      50% { transform: scale(1.12); box-shadow: 0 0 24px 8px rgba(251, 191, 36, 0.8); }
      100% { transform: scale(1.08); box-shadow: 0 0 16px 4px rgba(251, 191, 36, 0.6); }
    }
    .active-focus-num {
      animation: pastelFocusNum 0.35s ease-out forwards;
      background-color: #fef08a !important; /* パステルイエロー */
      border-color: #f59e0b !important;
      color: #78350f !important;
      z-index: 30;
    }

    @keyframes pastelFocusLabel {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1.1); }
    }
    .active-focus-label {
      animation: pastelFocusLabel 0.35s ease-out forwards;
      background-color: #fbcfe8 !important; /* パステルピンク */
      color: #be123c !important;
      border-color: #f43f5e !important;
      font-weight: 900 !important;
      z-index: 30;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between overflow-hidden select-none">

  <!-- 1. スタート画面（トップ画面） -->
  <div id="start-screen" class="flex-1 flex flex-col justify-center items-center p-4 md:p-6 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 overflow-y-auto">
    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl max-w-md w-full text-center border-4 border-indigo-200 relative my-auto">
      
      <div class="text-6xl mb-3 text-indigo-400 animate-bounce">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-800 mb-1">すうじ おぼえ</h1>
      <p class="text-xs text-indigo-600 font-bold mb-6">たのしく すうじの しくみを まなぼう！</p>
      
      <!-- レベル選択ボタン群 -->
      <div class="space-y-4 mb-6">
        
        <!-- Lv1: すうじ クイズ（従来の12問テスト） -->
        <button onclick="showQuizSettingsScreen()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-400 hover:from-emerald-500 hover:to-teal-500 text-white p-4 rounded-2xl shadow-md border-2 border-emerald-200 transform active:scale-95 transition-all text-left flex items-center gap-4 group">
          <div class="w-12 h-12 rounded-xl bg-white bg-opacity-20 flex items-center justify-center text-2xl shrink-0 group-hover:scale-110 transition-transform">
            🎯
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <span class="text-lg font-black tracking-wide">すうじ クイズ</span>
              <span class="text-xs font-black bg-white text-emerald-700 px-2.5 py-0.5 rounded-full border border-emerald-100">Lv1</span>
            </div>
            <p class="text-xs text-emerald-100 font-medium mt-0.5">1セット 12もんの お勉強クイズに挑戦！</p>
          </div>
        </button>

        <!-- Lv2: くらいのおへや -->
        <button onclick="openRoomMode()" class="w-full bg-gradient-to-r from-purple-400 to-indigo-400 hover:from-purple-500 hover:to-indigo-500 text-white p-4 rounded-2xl shadow-md border-2 border-purple-200 transform active:scale-95 transition-all text-left flex items-center gap-4 group">
          <div class="w-12 h-12 rounded-xl bg-white bg-opacity-20 flex items-center justify-center text-2xl shrink-0 group-hover:scale-110 transition-transform">
            🏠
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <span class="text-lg font-black tracking-wide">くらいのおへや</span>
              <span class="text-xs font-black bg-white text-purple-700 px-2.5 py-0.5 rounded-full border border-purple-100">Lv2</span>
            </div>
            <p class="text-xs text-purple-100 font-medium mt-0.5">万・千・百・十・一のへやで読み方をひもとこう！</p>
          </div>
        </button>

      </div>

      <!-- バージョン表示 -->
      <div id="version-display" class="text-[10px] text-slate-400 mt-2 text-center font-semibold">
        Ver 1.00
      </div>
    </div>
  </div>

  <!-- 1.5. 問題設定画面（すうじクイズ選択時の中間ページ） -->
  <div id="quiz-settings-screen" class="hidden flex-1 flex flex-col justify-center items-center p-4 md:p-6 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 overflow-y-auto select-none">
    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl max-w-md w-full border-4 border-emerald-300 relative my-auto">
      
      <!-- 上部コントロール（戻るボタン） -->
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
        <button onclick="exitToStartScreen()" class="text-slate-600 hover:text-slate-800 font-bold text-xs bg-slate-100 hover:bg-slate-200 py-1.5 px-3 rounded-xl flex items-center gap-1 transition-colors">
          <i class="fa-solid fa-arrow-left"></i> もどる
        </button>
        <span class="text-xs font-black px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full border border-emerald-200">
          🎯 Lv1 すうじクイズ
        </span>
      </div>

      <div class="text-center mb-5">
        <h2 class="text-2xl font-black text-slate-800">すうじ おぼえ</h2>
        <p class="text-xs text-emerald-600 font-bold mt-1">クイズの はんいを えらんでね！</p>
      </div>

      <!-- 設定エリア -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-emerald-100 mb-6 text-left">
        <!-- クイック選択 -->
        <label class="block text-xs font-bold text-slate-700 mb-2">🔢 かんたん はんい選択:</label>
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button onclick="setRange(1, 10)" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-bold py-2.5 px-2 rounded-xl text-xs transition-colors text-center border border-emerald-200">1 〜 10</button>
          <button onclick="setRange(1, 20)" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-bold py-2.5 px-2 rounded-xl text-xs transition-colors text-center border border-emerald-200">1 〜 20</button>
          <button onclick="setRange(1, 150)" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-bold py-2.5 px-2 rounded-xl text-xs transition-colors text-center border border-emerald-200">1 〜 150</button>
        </div>

        <!-- 直接入力 -->
        <label class="block text-xs font-bold text-slate-700 mb-2">✏️ じぶんで 入力:</label>
        <div class="flex items-center justify-center space-x-2 bg-white p-2.5 rounded-xl border border-slate-200 mb-4">
          <input type="number" id="min-val" value="1" min="0" class="w-20 bg-slate-50 border border-slate-300 rounded-lg p-1.5 text-center text-lg font-extrabold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">
          <span class="text-slate-400 font-bold">〜</span>
          <input type="number" id="max-val" value="10" min="1" class="w-20 bg-slate-50 border border-slate-300 rounded-lg p-1.5 text-center text-lg font-extrabold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">
        </div>

        <!-- 向かい合わせモード -->
        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
          <label class="flex items-center justify-between cursor-pointer">
            <div>
              <span class="block text-xs font-bold text-slate-800">🔄 むかいあわせモード</span>
              <span class="block text-[10px] text-slate-500">親用ボタンを反転します</span>
            </div>
            <div class="relative">
              <input type="checkbox" id="flip-mode" class="sr-only peer">
              <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
            </div>
          </label>
        </div>
      </div>

      <!-- クイズスタートボタン -->
      <button onclick="startGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3.5 px-4 rounded-2xl text-xl shadow-md transform active:scale-95 transition-all flex items-center justify-center gap-2">
        <span>クイズスタート！</span> 🚀
      </button>

    </div>
  </div>

  <!-- 2. 「くらいのおへや」自由学習画面 (Lv2) -->
  <div id="room-screen" class="hidden flex-1 flex flex-col justify-between p-4 bg-slate-50 select-none overflow-y-auto">
    <!-- 上部ヘッダーコントロール -->
    <div class="bg-white rounded-3xl shadow-sm p-4 border border-purple-100 mb-4 max-w-lg mx-auto w-full">
      <div class="flex justify-between items-center mb-3">
        <button onclick="exitToStartScreen()" class="text-slate-600 hover:text-slate-800 font-bold text-xs bg-slate-100 hover:bg-slate-200 py-1.5 px-3 rounded-xl flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> トップへ
        </button>
        <span class="text-xs font-black px-3 py-1 bg-purple-100 text-purple-800 rounded-full border border-purple-200">
          🏠 Lv2 くらいのおへや
        </span>
      </div>

      <!-- 5桁入力＆ランダム指定 -->
      <div class="flex flex-col gap-3 bg-purple-50/60 p-3.5 rounded-2xl border border-purple-100">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-purple-900">🔢 5桁の数字をつくる:</span>
          
          <!-- ランダムポップアップ切り替えボタン -->
          <div class="relative">
            <button onclick="toggleRandomMenu()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-1.5 px-3 rounded-xl text-xs shadow-sm transition-all flex items-center gap-1">
              <i class="fa-solid fa-shuffle"></i> ランダム指定 <i class="fa-solid fa-caret-down text-[10px]"></i>
            </button>
            
            <!-- 1〜5桁ランダム選択メニュー -->
            <div id="random-menu" class="hidden absolute right-0 mt-1 w-36 bg-white border-2 border-purple-200 rounded-2xl shadow-xl z-50 overflow-hidden py-1">
              <button onclick="setProtoRandomDigit(1)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-slate-700 hover:bg-purple-100">1桁 (1〜9)</button>
              <button onclick="setProtoRandomDigit(2)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-slate-700 hover:bg-purple-100">2桁 (10〜99)</button>
              <button onclick="setProtoRandomDigit(3)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-slate-700 hover:bg-purple-100">3桁 (100〜999)</button>
              <button onclick="setProtoRandomDigit(4)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-slate-700 hover:bg-purple-100">4桁 (1000〜9999)</button>
              <button onclick="setProtoRandomDigit(5)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-slate-700 hover:bg-purple-100">5桁 (10000〜99999)</button>
            </div>
          </div>
        </div>

        <!-- 5つの桁のドロップダウン（万・千・百・十・一） -->
        <div class="grid grid-cols-5 gap-1.5">
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-purple-700">万</span>
            <select id="digit-10000" onchange="onProtoDigitChange()" class="w-full bg-white border border-purple-200 rounded-xl p-1 text-center font-black text-slate-800 text-lg focus:ring-2 focus:ring-purple-400">
              <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-amber-700">千</span>
            <select id="digit-1000" onchange="onProtoDigitChange()" class="w-full bg-white border border-amber-200 rounded-xl p-1 text-center font-black text-slate-800 text-lg focus:ring-2 focus:ring-amber-400">
              <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-emerald-700">百</span>
            <select id="digit-100" onchange="onProtoDigitChange()" class="w-full bg-white border border-emerald-200 rounded-xl p-1 text-center font-black text-slate-800 text-lg focus:ring-2 focus:ring-emerald-400">
              <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-sky-700">十</span>
            <select id="digit-10" onchange="onProtoDigitChange()" class="w-full bg-white border border-sky-200 rounded-xl p-1 text-center font-black text-slate-800 text-lg focus:ring-2 focus:ring-sky-400">
              <option value="0">0</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-rose-700">一</span>
            <select id="digit-1" onchange="onProtoDigitChange()" class="w-full bg-white border border-rose-200 rounded-xl p-1 text-center font-black text-slate-800 text-lg focus:ring-2 focus:ring-rose-400">
              <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- パステル調のメイン学習ステージ -->
    <div class="flex-1 max-w-lg w-full mx-auto bg-white rounded-3xl shadow-sm border border-slate-200/80 p-4 md:p-6 flex flex-col justify-between items-center min-h-[400px] relative overflow-hidden">
      
      <div class="text-xs font-bold text-purple-700 bg-purple-50/80 px-4 py-1.5 rounded-full border border-purple-100 text-center mb-2">
        🏠 位のお部屋（数字 ➔ 位の言葉の順にフォーカス読み）
      </div>

      <!-- 位のお部屋ステージエリア -->
      <div id="room-stage-area" class="w-full flex-1 flex flex-col items-center justify-center my-auto">
        <!-- JavaScriptで動的生成 -->
      </div>
    </div>
  </div>

  <!-- 3. クイズゲーム画面 -->
  <div id="game-screen" class="hidden flex-1 flex flex-col justify-between p-4 pb-8 select-none">
    
    <!-- 親御さん用コントロールエリア（画面上部） -->
    <div id="control-panel" class="bg-white rounded-2xl shadow-md p-4 border border-slate-200 transition-transform duration-300">
      <div class="flex justify-between items-center mb-3">
        <!-- 戻るボタン -->
        <button onclick="exitToStartScreen()" class="text-slate-500 hover:text-slate-700 font-semibold text-sm bg-slate-100 hover:bg-slate-200 py-1.5 px-3 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> おわる
        </button>
        
        <!-- 現在の進捗度表示 -->
        <div id="progress-indicator" class="text-sm font-black px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100">
          もんだい: 1 / 12
        </div>
        
        <!-- 向き切り替え -->
        <button onclick="toggleFlip()" class="text-slate-500 hover:text-slate-700 text-sm bg-slate-100 hover:bg-slate-200 p-1.5 rounded-lg" title="親用ボタンの向きを反転">
          <i class="fa-solid fa-arrows-rotate"></i> 反転
        </button>
      </div>

      <!-- 親御さんの判定ボタン群 (9:2:9) -->
      <div class="grid grid-cols-[9fr_2fr_9fr] gap-3" id="action-buttons">
        <!-- ✖️ボタン -->
        <button id="btn-wrong" onclick="handleAnswer(false)" class="bg-rose-500 hover:bg-rose-600 text-white py-3 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
          <span class="text-4xl font-extrabold leading-none">✖</span>
          <span class="text-xs font-bold" id="label-wrong">ちがう</span>
        </button>

        <!-- 読み上げ・答えボタン -->
        <button id="btn-reading" onclick="handleShowReadingButton()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 py-3 px-1 rounded-xl flex flex-col items-center justify-center gap-1.5 active:scale-95 transition-all shadow-md overflow-hidden">
          <span class="text-xl leading-none"><i class="fa-solid fa-volume-high"></i></span>
          <span class="text-[9px] font-bold tracking-tighter whitespace-nowrap">よみ・こたえ</span>
        </button>

        <!-- ◯ボタン -->
        <button id="btn-correct" onclick="handleAnswer(true)" class="bg-emerald-500 hover:bg-emerald-600 text-white py-3 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
          <span class="text-4xl font-extrabold leading-none">◯</span>
          <span class="text-xs font-bold" id="label-correct">あってる</span>
        </button>
      </div>
    </div>

    <!-- お子様用メイン表示エリア -->
    <div class="flex-1 flex flex-col justify-center items-center my-4 relative w-full overflow-hidden min-h-[360px]">
      
      <!-- 背景散りばめ数字 -->
      <div id="bg-numbers-container" class="absolute inset-0 pointer-events-none select-none overflow-hidden transition-all duration-300">
      </div>

      <!-- メイン表示エリア -->
      <div id="target-display" class="flex flex-col justify-center items-center transition-all duration-300 relative z-10 w-full">
        
        <!-- 立体スロット合体ステージ -->
        <div id="slot-stage" class="hidden relative h-40 md:h-52 flex justify-center items-center select-none mb-4 font-mono">
        </div>

        <!-- 巨大な数字 -->
        <div id="number-text" class="text-[9rem] md:text-[13rem] font-extrabold text-slate-800 leading-none tracking-tight select-none drop-shadow-md transition-transform duration-300 flex justify-center items-center">
          0
        </div>
        
        <!-- 桁分解カード表示エリア -->
        <div id="decomposition-container" class="flex flex-wrap gap-3 mt-4 justify-center items-center w-full max-w-md px-4 min-h-[110px]">
        </div>

        <!-- 読み方 -->
        <div id="reading-text" class="h-14 text-2xl md:text-3xl font-bold text-blue-600 mt-2 opacity-0 transition-opacity duration-200 select-none bg-blue-50 px-6 py-1.5 rounded-full border border-blue-100 shadow-sm">
          よみかた
        </div>
      </div>
    </div>

  </div>

  <!-- 4. 結果発表画面 -->
  <div id="result-screen" class="hidden fixed inset-0 bg-slate-900 bg-opacity-80 backdrop-blur-sm z-50 flex justify-center items-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-4 border-yellow-400 relative overflow-hidden">
      <div class="text-7xl mb-4 text-yellow-500 animate-bounce">
        <i class="fa-solid fa-crown"></i>
      </div>
      <h2 class="text-3xl font-black text-slate-800 mb-2">お勉強おわり！</h2>
      <p class="text-emerald-600 font-bold mb-6 text-lg">たいへんよくできました！💮</p>
      
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-6 text-left space-y-3 text-sm text-slate-600 font-bold">
        <div class="flex justify-between items-center">
          <span>🎯 いっぱつで あたったよ：</span>
          <span class="text-lg text-emerald-600" id="result-perfect">0 / 12</span>
        </div>
        <div class="flex justify-between items-center border-t border-slate-200 pt-2">
          <span>🔄 おさらいで あたったよ：</span>
          <span class="text-lg text-amber-500" id="result-learned">0 / 0</span>
        </div>
      </div>

      <div class="space-y-3">
        <button onclick="restartWithSameSettings()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-extrabold py-3 px-6 rounded-xl text-lg shadow-md transform active:scale-95 transition-all">
          もう一回おなじ範囲で遊ぶ
        </button>
        <button onclick="exitToStartScreen()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-xl text-md transform active:scale-95 transition-all">
          スタート画面に戻る
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-lg font-bold shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    メッセージ
  </div>

  <script>
    // ==========================================
    // アプリケーション設定
    // ==========================================
    const APP_VERSION = "1.16"; // コード変更ごとに0.01追加

    // 状態管理
    let config = {
      min: 1,
      max: 10,
      isFlipped: false
    };

    let state = {
      questions: [],        
      currentIndex: 0,      
      isReviewMode: false,  
      
      wrongNumbers: [],     
      reviewQuestions: [],  
      reviewIndex: 0,       

      firstTryCorrectCount: 0, 
      reviewCorrectCount: 0,   
      totalWrongCount: 0,      
      
      currentNumber: 0,
      isReadingShown: false,
      isTransitioning: false,   

      isAwaitingManualConfirm: false,
      firstInputIsCorrect: null
    };

    // くらいのおへや用状態
    let roomState = {
      isReading: false
    };

    // タイマー管理
    let activeTimers = [];
    function setSafeTimeout(fn, delay) {
      const timer = setTimeout(() => {
        fn();
        activeTimers = activeTimers.filter(t => t !== timer);
      }, delay);
      activeTimers.push(timer);
      return timer;
    }
    function clearAllTimers() {
      activeTimers.forEach(t => clearTimeout(t));
      activeTimers = [];
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateSessionQuestions(min, max) {
      const pool = [];
      for (let i = min; i <= max; i++) {
        pool.push(i);
      }
      
      let result = [];
      if (pool.length >= 12) {
        const shuffledPool = shuffleArray(pool);
        result = shuffledPool.slice(0, 12);
      } else {
        result = [...pool];
        while (result.length < 12) {
          const randNum = pool[Math.floor(Math.random() * pool.length)];
          result.push(randNum);
        }
        result = shuffleArray(result);
      }
      return result;
    }

    function getDigitDecomposition(num) {
      if (num === 0) {
        return [{
          value: 0,
          label: '0',
          reading: 'れい',
          color: 'bg-slate-100 text-slate-800 border-slate-300'
        }];
      }

      const list = [];
      const numStr = num.toString();
      const len = numStr.length;

      if (len >= 3) {
        const hDigit = parseInt(numStr.charAt(len - 3));
        if (hDigit > 0) {
          const val = hDigit * 100;
          let rd = '';
          if (hDigit === 1) rd = 'ひゃく';
          else if (hDigit === 3) rd = 'さんびゃく';
          else if (hDigit === 6) rd = 'ろっぴゃく';
          else if (hDigit === 8) rd = 'はっぴゃく';
          else {
            const hReadings = {2:'に', 4:'よん', 5:'ご', 7:'なな', 9:'きゅう'};
            rd = hReadings[hDigit] + 'ひゃく';
          }
          list.push({
            value: val,
            label: val.toString(),
            reading: rd,
            color: 'bg-emerald-100 text-emerald-800 border-emerald-300',
            textColor: 'text-emerald-500'
          });
        }
      }

      if (len >= 2) {
        const tDigit = parseInt(numStr.charAt(len - 2));
        if (tDigit > 0) {
          const val = tDigit * 10;
          let rd = '';
          if (tDigit === 1) rd = 'じゅう';
          else {
            const tReadings = {2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
            rd = tReadings[tDigit] + 'じゅう';
          }
          list.push({
            value: val,
            label: val.toString(),
            reading: rd,
            color: 'bg-sky-100 text-sky-800 border-sky-300',
            textColor: 'text-sky-500'
          });
        }
      }

      const oDigit = parseInt(numStr.charAt(len - 1));
      if (oDigit > 0) {
        const oReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        list.push({
          value: oDigit,
          label: oDigit.toString(),
          reading: oReadings[oDigit],
          color: 'bg-rose-100 text-rose-800 border-rose-300',
          textColor: 'text-rose-500'
        });
      }

      return list;
    }

    function getReadingText(num) {
      if (num === undefined || num === null) return '';
      const decomp = getDigitDecomposition(num);
      return decomp.map(item => item.reading).join('');
    }

    function setRange(min, max) {
      document.getElementById('min-val').value = min;
      document.getElementById('max-val').value = max;
    }

    function toggleFlip() {
      config.isFlipped = !config.isFlipped;
      applyFlip();
      showToast(config.isFlipped ? "🔄 むかいあわせ（親：奥、子：手前）" : "🔄 おなじむき（全員手前向き）");
    }

    function applyFlip() {
      const controlPanel = document.getElementById('control-panel');
      const display = document.getElementById('target-display');
      
      if (config.isFlipped) {
        controlPanel.classList.add('rotate-180');
        display.classList.remove('rotate-180');
      } else {
        controlPanel.classList.remove('rotate-180');
        display.classList.remove('rotate-180');
      }
    }

    function disableActionButtons(disabled) {
      const container = document.getElementById('action-buttons');
      if (disabled) {
        container.classList.add('opacity-40', 'pointer-events-none');
      } else {
        container.classList.remove('opacity-40', 'pointer-events-none');
      }
    }

    function showQuizSettingsScreen() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-settings-screen').classList.remove('hidden');
    }

    function exitToStartScreen() {
      clearAllTimers();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      
      roomState.isReading = false;
      state.isTransitioning = false;
      state.isAwaitingManualConfirm = false;
      disableActionButtons(false);

      document.getElementById('quiz-settings-screen').classList.add('hidden');
      document.getElementById('room-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    function startGame() {
      clearAllTimers();
      const minInput = parseInt(document.getElementById('min-val').value);
      const maxInput = parseInt(document.getElementById('max-val').value);

      if (isNaN(minInput) || isNaN(maxInput) || minInput > maxInput) {
        showToast("⚠️ はんいを 正しくいれてね");
        return;
      }

      config.min = minInput;
      config.max = maxInput;
      config.isFlipped = document.getElementById('flip-mode').checked;

      state.questions = generateSessionQuestions(config.min, config.max);
      state.currentIndex = 0;
      state.isReviewMode = false;
      state.wrongNumbers = [];
      state.reviewQuestions = [];
      state.reviewIndex = 0;
      
      state.firstTryCorrectCount = 0;
      state.reviewCorrectCount = 0;
      state.totalWrongCount = 0;
      
      state.isTransitioning = true;
      disableActionButtons(true);

      state.isAwaitingManualConfirm = false;
      state.firstInputIsCorrect = null;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-settings-screen').classList.add('hidden');
      document.getElementById('room-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      document.getElementById('decomposition-container').innerHTML = '';
      document.getElementById('slot-stage').innerHTML = '';
      document.getElementById('slot-stage').classList.add('hidden');
      document.getElementById('number-text').classList.remove('hidden');

      applyFlip();
      nextQuestion();
    }

    function restartWithSameSettings() {
      startGame();
    }

    function updateProgressUI() {
      const indicator = document.getElementById('progress-indicator');
      
      if (state.isAwaitingManualConfirm) {
        indicator.innerText = `おして次へ ➔`;
        indicator.className = "text-sm font-black px-4 py-1 bg-amber-500 text-white rounded-full border border-amber-600 animate-pulse";
        return;
      }

      if (!state.isReviewMode) {
        indicator.innerText = `もんだい: ${state.currentIndex + 1} / 12`;
        indicator.className = "text-sm font-black px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100";
      } else {
        const roundProgress = state.reviewIndex + 1;
        const roundTotal = state.reviewQuestions.length;
        indicator.innerText = `おさらい: ${roundProgress} / ${roundTotal}`;
        indicator.className = "text-sm font-black px-3 py-1 bg-amber-50 text-amber-700 rounded-full border border-amber-100 animate-pulse";
      }
    }

    function generateBackgroundNumbers(num) {
      if (num === undefined || num === null) return;
      
      const container = document.getElementById('bg-numbers-container');
      container.innerHTML = '';

      const fonts = [
        { class: 'font-sans font-normal' },
        { class: 'font-sans font-bold' },
        { class: 'font-serif font-normal' },
        { class: 'font-serif font-bold' },
        { class: 'font-mono font-normal' },
        { class: 'font-mono font-bold' },
        { style: 'font-family: Impact, sans-serif; font-weight: 900;' },
        { style: 'font-family: Georgia, serif; font-style: italic;' },
        { style: 'font-family: "Courier New", monospace; font-weight: bold;' },
        { style: 'font-family: "Times New Roman", serif; font-style: italic;' },
        { style: 'font-family: "Comic Sans MS", cursive; font-weight: bold;' },
        { style: 'font-family: "Trebuchet MS", sans-serif; font-weight: bold;' },
        { style: 'font-family: "Arial Black", sans-serif;' },
        { style: 'font-family: "Palatino Linotype", serif;' }
      ];

      const numCount = 14;

      for (let i = 0; i < numCount; i++) {
        const el = document.createElement('div');
        el.innerText = num;
        el.classList.add('absolute', 'text-slate-800', 'select-none', 'pointer-events-none');
        
        const opacity = (Math.random() * 6 + 10).toFixed(1);
        el.style.opacity = (opacity / 100).toString();

        const top = Math.floor(Math.random() * 80) + 10;
        const left = Math.floor(Math.random() * 80) + 10;
        el.style.top = `${top}%`;
        el.style.left = `${left}%`;

        const size = (Math.random() * 3.5 + 2).toFixed(1);
        el.style.fontSize = `${size}rem`;

        const rotate = Math.floor(Math.random() * 80) - 40;
        el.style.transform = `translate(-50%, -50%) rotate(${rotate}deg)`;

        const font = fonts[Math.floor(Math.random() * fonts.length)];
        if (font.class) {
          font.class.split(' ').forEach(cls => el.classList.add(cls));
        }
        if (font.style) {
          el.style.cssText += ';' + font.style;
        }

        container.appendChild(el);
      }
    }

    function renderColoredMainNumber(num, isColored = false) {
      const container = document.getElementById('number-text');
      container.innerHTML = ''; 
      
      const numStr = num.toString();
      const len = numStr.length;

      for (let i = 0; i < len; i++) {
        const char = numStr.charAt(i);
        const span = document.createElement('span');
        span.innerText = char;
        span.className = "text-slate-800 transition-colors duration-300";

        if (isColored) {
          const currentPosFromRight = len - i;

          if (currentPosFromRight === 3) {
            if (parseInt(char) > 0) {
              span.className = "text-emerald-500 font-black transition-colors duration-300";
            } else {
              span.className = "text-slate-300 font-normal transition-colors duration-300"; 
            }
          } else if (currentPosFromRight === 2) {
            if (parseInt(char) > 0) {
              span.className = "text-sky-500 font-black transition-colors duration-300";
            } else {
              span.className = "text-slate-300 font-normal transition-colors duration-300"; 
            }
          } else if (currentPosFromRight === 1) {
            if (parseInt(char) > 0 || num === 0) {
              span.className = "text-rose-500 font-black transition-colors duration-300";
            } else {
              span.className = "text-slate-300 font-normal transition-colors duration-300"; 
            }
          }
        }

        container.appendChild(span);
      }
    }

    function nextQuestion() {
      state.isReadingShown = false;
      state.isAwaitingManualConfirm = false; 
      
      const readingEl = document.getElementById('reading-text');
      readingEl.classList.add('opacity-0');

      const decompContainer = document.getElementById('decomposition-container');
      decompContainer.innerHTML = '';

      const slotStage = document.getElementById('slot-stage');
      slotStage.innerHTML = '';
      slotStage.classList.add('hidden');

      const numTextEl = document.getElementById('number-text');
      numTextEl.classList.remove('hidden');
      numTextEl.style.transform = 'scale(1)';

      resetActionButtonsUI();

      if (!state.isReviewMode) {
        state.currentNumber = state.questions[state.currentIndex];
      } else {
        state.currentNumber = state.reviewQuestions[state.reviewIndex];
      }
      
      if (state.currentNumber === undefined || state.currentNumber === null) {
        state.isTransitioning = false;
        disableActionButtons(false);
        showResults();
        return;
      }
      
      renderColoredMainNumber(state.currentNumber, false);
      readingEl.innerText = getReadingText(state.currentNumber);
      
      updateProgressUI();
      generateBackgroundNumbers(state.currentNumber);

      state.isTransitioning = false;
      disableActionButtons(false);
    }

    function resetActionButtonsUI() {
      const container = document.getElementById('action-buttons');
      container.className = "grid grid-cols-[9fr_2fr_9fr] gap-3";

      document.getElementById('btn-wrong').classList.remove('hidden');
      document.getElementById('btn-reading').classList.remove('hidden');
      document.getElementById('btn-correct').classList.remove('hidden');

      document.getElementById('label-wrong').innerText = "ちがう";
      document.getElementById('label-correct').innerText = "あってる";
    }

    function appendDecompositionCardElement(item, index) {
      const decompContainer = document.getElementById('decomposition-container');
      
      const card = document.createElement('div');
      card.className = `flex flex-col items-center bg-white border-2 ${item.color} rounded-2xl p-2 px-4 shadow-md opacity-0 transform scale-75 border-b-4`;
      card.innerHTML = `
        <span class="text-2xl md:text-3xl font-extrabold tracking-tight">${item.label}</span>
        <span class="text-xs md:text-sm font-bold text-slate-500 mt-1 bg-white bg-opacity-70 px-2 rounded-full">${item.reading}</span>
      `;
      
      decompContainer.appendChild(card);

      setSafeTimeout(() => {
        card.classList.remove('opacity-0', 'scale-75');
        card.classList.add('animate-pop-in');
      }, 50);
    }

    function triggerSlotDecompositionAnimation(onCompleteCallback) {
      const slotStage = document.getElementById('slot-stage');
      const numTextEl = document.getElementById('number-text');

      numTextEl.classList.add('hidden');
      slotStage.classList.remove('hidden');
      slotStage.innerHTML = ''; 

      const num = state.currentNumber;
      const numStr = num.toString();
      const len = numStr.length;

      if (len === 1) {
        slotStage.style.width = '100px';
        const card = document.createElement('div');
        card.className = "w-24 h-36 flex items-center justify-center font-extrabold rounded-2xl border-2 border-b-8 shadow-lg bg-rose-500 border-rose-600 text-white text-7xl animate-drop-slot";
        card.innerText = numStr;
        slotStage.appendChild(card);
        
        setSafeTimeout(() => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(num.toString());
            utterance.lang = 'ja-JP';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
          }
          appendDecompositionCardElement({label: num.toString(), reading: getReadingText(num), color: 'bg-rose-100 text-rose-800 border-rose-300'}, 0);
          
          setSafeTimeout(() => {
            if (onCompleteCallback) onCompleteCallback();
          }, 800);
        }, 700);
        return;
      }

      const cellWidth = window.innerWidth < 640 ? 75 : 105; 
      const cellHeight = window.innerWidth < 640 ? 110 : 155;
      const gap = 8;
      const totalWidth = cellWidth * len + gap * (len - 1);
      
      slotStage.style.width = `${totalWidth}px`;
      slotStage.className = "relative h-40 md:h-52 flex justify-center items-center select-none mb-4 font-mono";

      const cells = [];
      for (let i = 0; i < len; i++) {
        const cell = document.createElement('div');
        cell.className = "relative flex items-center justify-center rounded-2xl bg-slate-50 border border-dashed border-slate-300";
        cell.style.width = `${cellWidth}px`;
        cell.style.height = `${cellHeight}px`;
        slotStage.appendChild(cell);
        cells.push(cell);
      }

      const baseDigits = [];
      const highestDigitChar = numStr.charAt(0);
      const highestDigitVal = parseInt(highestDigitChar);

      let highestColorTheme = "";
      let highestReading = "";
      if (len === 3) {
        highestColorTheme = "border-emerald-500 bg-white text-emerald-600"; 
        highestReading = getReadingText(highestDigitVal * 100);
      } else {
        highestColorTheme = "border-sky-500 bg-white text-sky-600"; 
        highestReading = getReadingText(highestDigitVal * 10);
      }

      baseDigits.push({
        digitIndex: 0,
        char: highestDigitChar,
        reading: highestReading,
        colorTheme: highestColorTheme,
        borderColor: len === 3 ? "border-emerald-400" : "border-sky-400",
        decompItem: len === 3 ? {label: (highestDigitVal * 100).toString(), reading: highestReading, color: 'bg-emerald-100 text-emerald-800 border-emerald-300'} : {label: (highestDigitVal * 10).toString(), reading: highestReading, color: 'bg-sky-100 text-sky-800 border-sky-300'}
      });

      for (let i = 1; i < len; i++) {
        baseDigits.push({
          digitIndex: i,
          char: "0",
          reading: "", 
          colorTheme: "border-slate-300 bg-slate-100 text-slate-400", 
          borderColor: "border-slate-300",
          decompItem: null
        });
      }

      const activeBaseCards = []; 
      baseDigits.forEach((digit) => {
        const cell = cells[digit.digitIndex];
        
        const card = document.createElement('div');
        card.className = `absolute inset-0 flex items-center justify-center font-black rounded-2xl border-2 border-b-8 shadow-md opacity-0 z-10`;
        card.className += ` ${digit.colorTheme}`;
        card.className += len >= 3 ? " text-5xl md:text-7xl" : " text-6xl md:text-8xl";
        card.innerText = digit.char;

        const ring = document.createElement('div');
        ring.className = `absolute rounded-3xl border-4 opacity-0 pointer-events-none z-0`;
        ring.style.width = "115%";
        ring.style.height = "115%";
        ring.className += ` ${digit.borderColor}`;

        cell.appendChild(ring);
        cell.appendChild(card);

        activeBaseCards[digit.digitIndex] = { card, ring };

        card.classList.remove('opacity-0');
        card.classList.add('animate-drop-slot');

        setSafeTimeout(() => {
          ring.classList.add('animate-shockwave');
          if (digit.reading && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(digit.reading);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
          }
          if (digit.decompItem) {
            appendDecompositionCardElement(digit.decompItem, 0);
          }
        }, 400); 
      });

      let currentStepDelay = 1500;

      for (let i = 1; i < len; i++) {
        const char = numStr.charAt(i);
        const val = parseInt(char);

        if (val === 0) {
          continue; 
        }

        const digitIndex = i;
        const cell = cells[digitIndex];

        let colorTheme = "";
        let reading = "";
        let borderColor = "";
        let decompItem = null;

        if (len === 3 && digitIndex === 1) {
          colorTheme = "border-sky-500 bg-white text-sky-600";
          reading = getReadingText(val * 10);
          borderColor = "border-sky-400";
          decompItem = {label: (val * 10).toString(), reading: reading, color: 'bg-sky-100 text-sky-800 border-sky-300'};
        } else {
          colorTheme = "border-rose-500 bg-white text-rose-600";
          const oReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
          reading = oReadings[val];
          borderColor = "border-rose-400";
          decompItem = {label: val.toString(), reading: reading, color: 'bg-rose-100 text-rose-800 border-rose-300'};
        }

        const stepIdx = i;

        setSafeTimeout(() => {
          const overCard = document.createElement('div');
          overCard.className = `absolute inset-0 flex items-center justify-center font-black rounded-2xl border-2 border-b-8 shadow-md opacity-0 z-20`;
          overCard.className += ` ${colorTheme}`;
          overCard.className += len >= 3 ? " text-5xl md:text-7xl" : " text-6xl md:text-8xl";
          overCard.innerText = char;

          const ring = document.createElement('div');
          ring.className = `absolute rounded-3xl border-4 opacity-0 pointer-events-none z-10`;
          ring.style.width = "115%";
          ring.style.height = "115%";
          ring.className += ` ${borderColor}`;

          cell.appendChild(ring);
          cell.appendChild(overCard);

          overCard.classList.remove('opacity-0');
          overCard.classList.add('animate-drop-slot');

          setSafeTimeout(() => {
            ring.classList.add('animate-shockwave');
            
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(reading);
              utterance.lang = 'ja-JP';
              utterance.rate = 1.1;
              window.speechSynthesis.speak(utterance);
            }

            if (decompItem) {
              appendDecompositionCardElement(decompItem, stepIdx);
            }
          }, 400); 

        }, currentStepDelay);

        currentStepDelay += 1500; 
      }

      const totalWait = currentStepDelay + 500; 

      setSafeTimeout(() => {
        slotStage.classList.add('scale-105');

        for (let i = 1; i < len; i++) {
          const char = numStr.charAt(i);
          if (parseInt(char) === 0) {
            const baseElements = activeBaseCards[i];
            if (baseElements) {
              const card = baseElements.card;
              const ring = baseElements.ring;

              card.classList.remove('border-slate-300', 'bg-slate-100', 'text-slate-400');
              
              let activeColorTheme = "";
              let activeRingColor = "";
              if (len === 3 && i === 1) {
                activeColorTheme = "border-sky-500 bg-white text-sky-600";
                activeRingColor = "border-sky-400";
              } else {
                activeColorTheme = "border-rose-500 bg-white text-rose-600";
                activeRingColor = "border-rose-400";
              }
              
              card.className += ` ${activeColorTheme} transition-colors duration-300`;

              if (ring) {
                ring.classList.remove('border-slate-300', 'animate-shockwave');
                ring.className += ` ${activeRingColor}`;
                void ring.offsetWidth; 
                ring.classList.add('animate-shockwave');
              }
            }
          }
        }

        setSafeTimeout(() => {
          slotStage.classList.remove('scale-105');
        }, 150);

        if (onCompleteCallback) onCompleteCallback();
      }, totalWait);
    }

    function showReading(forceSpeech = true) {
      state.isReadingShown = false; // 再押し対応
      state.isReadingShown = true;

      const readingEl = document.getElementById('reading-text');

      triggerSlotDecompositionAnimation(() => {
        readingEl.classList.remove('opacity-0');

        if (forceSpeech && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(state.currentNumber.toString());
          utterance.lang = 'ja-JP';
          utterance.rate = 0.95; 
          window.speechSynthesis.speak(utterance);
        }
      });
    }

    function handleShowReadingButton() {
      if (state.isTransitioning) return;

      state.firstInputIsCorrect = false; 
      showReading(true);

      state.isTransitioning = true;
      disableActionButtons(true);

      const numStr = state.currentNumber.toString();
      const len = numStr.length;
      let nonZeroCount = 0;
      for (let i = 1; i < len; i++) {
        if (parseInt(numStr.charAt(i)) > 0) nonZeroCount++;
      }
      const totalWait = len === 1 ? 1500 : (nonZeroCount * 1500 + 3000);

      setSafeTimeout(() => {
        state.isTransitioning = false;
        disableActionButtons(false);
        
        state.isAwaitingManualConfirm = true;
        updateProgressUI();

        document.getElementById('btn-correct').classList.add('hidden');
        document.getElementById('btn-reading').classList.remove('hidden'); 
        
        const container = document.getElementById('action-buttons');
        container.className = "grid grid-cols-[3fr_7fr] gap-3";

        document.getElementById('label-wrong').innerText = "つぎへ進む";
      }, totalWait);
    }

    function handleAnswer(isCorrect) {
      if (state.isTransitioning) return;

      if (!state.isAwaitingManualConfirm) {
        state.isTransitioning = true;
        disableActionButtons(true);

        if (isCorrect) {
          // 「◯ (あってる)」を押した時：スロット解説表示＋音声再生後、2秒停止して自動進行
          showReading(true);

          const numStr = state.currentNumber.toString();
          const len = numStr.length;
          let nonZeroCount = 0;
          for (let i = 1; i < len; i++) {
            if (parseInt(numStr.charAt(i)) > 0) nonZeroCount++;
          }
          const totalAnimWait = len === 1 ? 1500 : (nonZeroCount * 1500 + 3000);

          setSafeTimeout(() => {
            proceedToNext(true); // 2秒経過後に自動進行（一発正解カウント）
          }, totalAnimWait + 2000);

        } else {
          // 「✖️ (ちがう)」を押した時：スロット解説表示＋音声再生後、手動進行待ちへ
          setSafeTimeout(() => {
            showReading(true);

            const numStr = state.currentNumber.toString();
            const len = numStr.length;
            let nonZeroCount = 0;
            for (let i = 1; i < len; i++) {
              if (parseInt(numStr.charAt(i)) > 0) nonZeroCount++;
            }
            const totalWait = len === 1 ? 1500 : (nonZeroCount * 1500 + 3000);

            setSafeTimeout(() => {
              state.isTransitioning = false;
              disableActionButtons(false);
              
              state.isAwaitingManualConfirm = true;
              state.firstInputIsCorrect = false; 
              
              updateProgressUI(); 

              document.getElementById('btn-correct').classList.add('hidden');
              document.getElementById('btn-reading').classList.remove('hidden');

              const container = document.getElementById('action-buttons');
              container.className = "grid grid-cols-[3fr_7fr] gap-3";

              document.getElementById('label-wrong').innerText = "つぎへ進む";
            }, totalWait);
          }, 1000);
        }
      } else {
        state.isAwaitingManualConfirm = false;
        proceedToNext(state.firstInputIsCorrect);
      }
    }

    function proceedToNext(isCorrect) {
      if (!state.isReviewMode) {
        if (isCorrect) {
          state.firstTryCorrectCount++;
        } else {
          state.totalWrongCount++;
          if (!state.wrongNumbers.includes(state.currentNumber)) {
            state.wrongNumbers.push(state.currentNumber);
          }
        }
        
        state.currentIndex++;
        
        if (state.currentIndex < 12) {
          nextQuestion();
        } else {
          if (state.wrongNumbers.length === 0) {
            state.isTransitioning = false;
            disableActionButtons(false);
            showResults();
          } else {
            startReviewMode();
          }
        }
      } else {
        if (isCorrect) {
          state.reviewCorrectCount++;
        } else {
          state.totalWrongCount++;
        }
        
        state.reviewIndex++;
        
        if (state.reviewIndex < state.reviewQuestions.length) {
          nextQuestion();
        } else {
          state.isTransitioning = false;
          disableActionButtons(false);
          showResults();
        }
      }
    }

    function startReviewMode() {
      state.isReviewMode = true;
      state.reviewQuestions = shuffleArray(state.wrongNumbers);
      state.reviewIndex = 0;
      
      state.isTransitioning = true;
      disableActionButtons(true);
      
      showToast(`🔄 まちがえた ${state.reviewQuestions.length}もん の おさらいいくよ！`);
      
      setSafeTimeout(() => {
        nextQuestion();
      }, 1000);
    }

    function showResults() {
      document.getElementById('result-perfect').innerText = `${state.firstTryCorrectCount} / 12`;
      
      const learnedEl = document.getElementById('result-learned');
      if (state.wrongNumbers.length > 0) {
        learnedEl.innerText = `${state.reviewCorrectCount} / ${state.wrongNumbers.length}`;
        learnedEl.parentElement.classList.remove('hidden');
      } else {
        learnedEl.innerText = "なし (パーフェクト！💮)";
      }
      
      document.getElementById('result-screen').classList.remove('hidden');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.remove('opacity-0');
      
      setSafeTimeout(() => {
        toast.classList.add('opacity-0');
      }, 1800);
    }

    function openRoomMode() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-settings-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('room-screen').classList.remove('hidden');
      
      renderRoomMode();
    }

    function toggleRandomMenu() {
      const menu = document.getElementById('random-menu');
      menu.classList.toggle('hidden');
    }

    function getProtoValueFromSelects() {
      const d10000 = document.getElementById('digit-10000').value;
      const d1000 = document.getElementById('digit-1000').value;
      const d100 = document.getElementById('digit-100').value;
      const d10 = document.getElementById('digit-10').value;
      const d1 = document.getElementById('digit-1').value;

      const numStr = `${d10000}${d1000}${d100}${d10}${d1}`;
      return parseInt(numStr, 10);
    }

    function onProtoDigitChange() {
      renderRoomMode();
    }

    function setProtoRandomDigit(digits) {
      document.getElementById('random-menu').classList.add('hidden');

      let min = Math.pow(10, digits - 1);
      let max = Math.pow(10, digits) - 1;
      if (digits === 1) min = 1; 

      const rand = Math.floor(Math.random() * (max - min + 1)) + min;
      const randStr = rand.toString().padStart(5, '0');

      document.getElementById('digit-10000').value = randStr.charAt(0);
      document.getElementById('digit-1000').value = randStr.charAt(1);
      document.getElementById('digit-100').value = randStr.charAt(2);
      document.getElementById('digit-10').value = randStr.charAt(3);
      document.getElementById('digit-1').value = randStr.charAt(4);

      renderRoomMode();
    }

    function getDigitReadingPhonetics(digitChar, place) {
      const d = parseInt(digitChar, 10);
      if (d === 0) return { numReading: '', placeReading: '' };

      if (place === '万') {
        const numReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'まん' };
      }
      if (place === '千') {
        if (d === 1) return { numReading: '', placeReading: 'せん' };
        if (d === 3) return { numReading: 'さん', placeReading: 'ぜん' };
        if (d === 8) return { numReading: 'はっ', placeReading: 'せん' };
        const numReadings = {2:'に', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'せん' };
      }
      if (place === '百') {
        if (d === 1) return { numReading: '', placeReading: 'ひゃく' };
        if (d === 3) return { numReading: 'さん', placeReading: 'びゃく' };
        if (d === 6) return { numReading: 'ろっ', placeReading: 'ぴゃく' };
        if (d === 8) return { numReading: 'はっ', placeReading: 'ぴゃく' };
        const numReadings = {2:'に', 4:'よん', 5:'ご', 7:'なな', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'ひゃく' };
      }
      if (place === '十') {
        if (d === 1) return { numReading: '', placeReading: 'じゅう' };
        const numReadings = {2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'じゅう' };
      }
      if (place === '一') {
        const numReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: '' }; 
      }
      return { numReading: '', placeReading: '' };
    }

    function renderRoomMode() {
      const val = getProtoValueFromSelects();
      const numStr = val.toString().padStart(5, '0');
      const stage = document.getElementById('room-stage-area');
      stage.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.className = "flex flex-col items-center gap-6 w-full max-w-md";

      const places = [
        { key: '10000', label: 'まん', char: numStr.charAt(0), color: 'border-purple-200 bg-purple-50/50 text-purple-700', headBg: 'bg-purple-300 text-purple-950' },
        { key: '1000',  label: 'せん', char: numStr.charAt(1), color: 'border-amber-200 bg-amber-50/50 text-amber-700', headBg: 'bg-amber-300 text-amber-950' },
        { key: '100',   label: 'ひゃく', char: numStr.charAt(2), color: 'border-emerald-200 bg-emerald-50/50 text-emerald-700', headBg: 'bg-emerald-300 text-emerald-950' },
        { key: '10',    label: 'じゅう', char: numStr.charAt(3), color: 'border-sky-200 bg-sky-50/50 text-sky-700', headBg: 'bg-sky-300 text-sky-950' },
        { key: '1',     label: '(いち)', char: numStr.charAt(4), color: 'border-rose-200 bg-rose-50/50 text-rose-700', headBg: 'bg-rose-300 text-rose-950' }
      ];

      const roomGrid = document.createElement('div');
      roomGrid.className = "grid grid-cols-5 gap-2 w-full bg-slate-100/80 p-3 rounded-3xl shadow-inner border border-slate-200/90";

      places.forEach((p, idx) => {
        const col = document.createElement('div');
        col.className = "flex flex-col items-center gap-1.5";

        const numBox = document.createElement('div');
        numBox.id = `room-box-${idx}`;
        numBox.className = `w-full h-24 md:h-28 flex items-center justify-center font-black text-5xl md:text-6xl rounded-2xl border-2 bg-white shadow-sm transition-all duration-200 ${p.color}`;
        numBox.innerText = p.char;

        const labelBox = document.createElement('div');
        labelBox.id = `room-label-${idx}`;
        labelBox.className = `w-full h-9 flex items-center justify-center font-black text-xs md:text-sm rounded-xl shadow-sm transition-all duration-200 ${p.headBg}`;
        labelBox.innerText = p.label;

        col.appendChild(numBox);
        col.appendChild(labelBox);
        roomGrid.appendChild(col);
      });

      wrapper.appendChild(roomGrid);

      const playBtn = document.createElement('button');
      playBtn.id = "room-play-btn";
      playBtn.className = "w-full bg-gradient-to-r from-purple-500 to-indigo-500 hover:from-purple-600 hover:to-indigo-600 text-white font-extrabold py-3.5 px-6 rounded-2xl text-base md:text-lg shadow-md active:scale-95 transition-all flex items-center justify-center gap-2";
      playBtn.innerHTML = `<i class="fa-solid fa-circle-play text-xl"></i> ▶ 音声とフォーカスで順にひもとく`;
      
      playBtn.onclick = () => {
        runRoomFocusSequence(numStr, places);
      };

      wrapper.appendChild(playBtn);
      stage.appendChild(wrapper);
    }

    function runRoomFocusSequence(numStr, places) {
      if (roomState.isReading) return;
      roomState.isReading = true;

      const btn = document.getElementById('room-play-btn');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-50');
      }

      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      for (let i = 0; i < 5; i++) {
        const b = document.getElementById(`room-box-${i}`);
        const l = document.getElementById(`room-label-${i}`);
        if (b) b.classList.remove('active-focus-num');
        if (l) l.classList.remove('active-focus-label');
      }

      const placeNames = ['万', '千', '百', '十', '一'];
      const sequence = [];

      let hasStarted = false;

      for (let i = 0; i < 5; i++) {
        const char = numStr.charAt(i);
        const d = parseInt(char, 10);
        const placeName = placeNames[i];

        if (d > 0) hasStarted = true;

        if (hasStarted) {
          const phonetics = getDigitReadingPhonetics(char, placeName);
          
          if (phonetics.numReading !== '' || phonetics.placeReading !== '') {
            if (phonetics.numReading !== '') {
              sequence.push({ type: 'num', index: i, speech: phonetics.numReading });
            }
            if (phonetics.placeReading !== '') {
              sequence.push({ type: 'label', index: i, speech: phonetics.placeReading });
            }
          }
        }
      }

      if (sequence.length === 0) {
        sequence.push({ type: 'num', index: 4, speech: 'れい' });
      }

      let stepIndex = 0;

      function playNextStep() {
        if (stepIndex >= sequence.length) {
          setSafeTimeout(() => {
            for (let i = 0; i < 5; i++) {
              const b = document.getElementById(`room-box-${i}`);
              const l = document.getElementById(`room-label-${i}`);
              if (b) b.classList.remove('active-focus-num');
              if (l) l.classList.remove('active-focus-label');
            }
            roomState.isReading = false;
            if (btn) {
              btn.disabled = false;
              btn.classList.remove('opacity-0');
              btn.classList.remove('opacity-50');
            }
          }, 600);
          return;
        }

        const step = sequence[stepIndex];

        for (let i = 0; i < 5; i++) {
          const b = document.getElementById(`room-box-${i}`);
          const l = document.getElementById(`room-label-${i}`);
          if (b) b.classList.remove('active-focus-num');
          if (l) l.classList.remove('active-focus-label');
        }

        if (step.type === 'num') {
          const targetBox = document.getElementById(`room-box-${step.index}`);
          if (targetBox) targetBox.classList.add('active-focus-num');
        } else {
          const targetLabel = document.getElementById(`room-label-${step.index}`);
          if (targetLabel) targetLabel.classList.add('active-focus-label');
        }

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(step.speech);
          utterance.lang = 'ja-JP';
          utterance.rate = 1.0;
          window.speechSynthesis.speak(utterance);
        }

        stepIndex++;
        setSafeTimeout(playNextStep, 700); 
      }

      playNextStep();
    }

    // ページロード時初期化
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('version-display').innerText = `Ver ${APP_VERSION}`;
    });
  </script>
</body>
</html>
