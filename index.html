<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数字おぼえゲーム</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* スマホでの誤タップやズームを防ぐスタイル */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* 回転用のクラス */
    .rotate-180 {
      transform: rotate(180deg);
    }
    /* ピョコッと飛び出すアニメーション */
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* ガチャーンと上から降ってくるアニメーション */
    @keyframes dropSlot {
      0% { transform: translateY(-250px) scaleY(1.4); opacity: 0; }
      55% { transform: translateY(15px) scaleY(0.85); opacity: 1; }
      75% { transform: translateY(-8px) scaleY(1.1); }
      100% { transform: translateY(0) scaleY(1); opacity: 1; }
    }
    .animate-drop-slot {
      animation: dropSlot 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* 衝撃波リング */
    @keyframes shockwave {
      0% { transform: scale(0.7); opacity: 1; border-width: 8px; }
      100% { transform: scale(1.5); opacity: 0; border-width: 1px; }
    }
    .animate-shockwave {
      animation: shockwave 0.4s ease-out forwards;
    }

    /* フォーカス中の強力な強調アニメーション */
    @keyframes focusPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      50% { transform: scale(1.12); box-shadow: 0 0 20px 8px rgba(245, 158, 11, 0.9); }
      100% { transform: scale(1.08); box-shadow: 0 0 12px 4px rgba(245, 158, 11, 0.6); }
    }
    .active-focus-num {
      animation: focusPulse 0.3s ease-out forwards;
      background-color: #fef08a !important; /* 黄色背景 */
      border-color: #f59e0b !important;
      color: #78350f !important;
      z-index: 30;
    }

    @keyframes focusPulseLabel {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1.1); }
    }
    .active-focus-label {
      animation: focusPulseLabel 0.3s ease-out forwards;
      background-color: #fbcfe8 !important; /* ピンク背景 */
      color: #9d174d !important;
      border-color: #f43f5e !important;
      font-weight: 900 !important;
      z-index: 30;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-hidden select-none">

  <!-- 1. スタート画面 -->
  <div id="start-screen" class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-br from-indigo-50 to-blue-100 overflow-y-auto">
    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border-4 border-blue-400 relative my-auto">
      <div class="text-6xl mb-4 text-blue-500 animate-bounce">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-800 mb-2">すうじ おぼえ</h1>
      <p class="text-sm text-gray-500 font-bold mb-6">1セット 12もんの おべんきょう</p>
      
      <!-- 範囲設定 -->
      <div class="mb-6 text-left">
        <label class="block text-gray-700 font-bold mb-2 text-sm">🔢 だす数字の はんい</label>
        
        <!-- クイック選択 -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button onclick="setRange(1, 10)" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-2 px-3 rounded-xl text-sm transition-colors">1 〜 10</button>
          <button onclick="setRange(1, 20)" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-2 px-3 rounded-xl text-sm transition-colors">1 〜 20</button>
          <button onclick="setRange(1, 150)" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-2 px-3 rounded-xl text-sm transition-colors">1 〜 150</button>
        </div>

        <!-- 直接入力 -->
        <div class="flex items-center space-x-2 bg-gray-50 p-3 rounded-xl border border-gray-200">
          <input type="number" id="min-val" value="1" min="0" class="w-20 bg-white border border-gray-300 rounded-lg p-2 text-center text-lg font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="text-gray-500 font-bold">〜</span>
          <input type="number" id="max-val" value="10" min="1" class="w-20 bg-white border border-gray-300 rounded-lg p-2 text-center text-lg font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>

      <!-- 反転設定（向かい合わせ用 - 初期状態OFF） -->
      <div class="mb-6 p-4 bg-yellow-50 rounded-2xl border border-yellow-200 text-left">
        <label class="flex items-center justify-between cursor-pointer">
          <div>
            <span class="block text-sm font-bold text-gray-800">🔄 むかいあわせモード</span>
            <span class="block text-xs text-gray-500 mt-0.5">ONにすると親用ボタンが反転し、向かい側（奥）から操作しやすくなります。</span>
          </div>
          <div class="relative">
            <input type="checkbox" id="flip-mode" class="sr-only peer">
            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
          </div>
        </label>
      </div>

      <!-- スタートボタン -->
      <button onclick="startGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-4 px-6 rounded-2xl text-2xl shadow-lg transform active:scale-95 transition-all mb-4">
        スタート！
      </button>

      <!-- プロトタイプ体験ボタン -->

        <span>🧪 案Bプロトタイプ（位のお部屋）</span>
      </button>

      <!-- バージョン表示 -->
      <div id="version-display" class="text-[10px] text-gray-400 mt-4 text-center font-semibold">
        Ver 1.00
      </div>
    </div>
  </div>

  <!-- 2. メインゲーム画面 -->
  <div id="game-screen" class="hidden flex-1 flex flex-col justify-between p-4 pb-8 select-none">
    
    <!-- 親御さん用コントロールエリア（画面上部） -->
    <div id="control-panel" class="bg-white rounded-2xl shadow-md p-4 border border-gray-200 transition-transform duration-300">
      <div class="flex justify-between items-center mb-3">
        <!-- 戻るボタン -->
        <button onclick="exitGame()" class="text-gray-500 hover:text-gray-700 font-semibold text-sm bg-gray-100 hover:bg-gray-200 py-1.5 px-3 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> おわる
        </button>
        
        <!-- 現在の進捗度表示 -->
        <div id="progress-indicator" class="text-sm font-black px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100">
          もんだい: 1 / 12

        <!-- 向き切り替え of 簡易スイッチ -->
        <button onclick="toggleFlip()" class="text-gray-500 hover:text-gray-700 text-sm bg-gray-100 hover:bg-gray-200 p-1.5 rounded-lg" title="親用ボタンの向きを反転">
          <i class="fa-solid fa-arrows-rotate"></i> 反転
        </button>
      </div>

      <!-- 親御さんの判定ボタン群 -->
      <div class="grid grid-cols-[9fr_2fr_9fr] gap-3" id="action-buttons">
        <!-- ✖️ボタン -->
        <button id="btn-wrong" onclick="handleAnswer(false)" class="bg-rose-500 hover:bg-rose-600 text-white py-3 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
          <span class="text-4xl font-extrabold leading-none">✖</span>

        </button>

        <!-- 読み上げ・答えボタン -->
        <button id="btn-reading" onclick="handleShowReadingButton()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 py-3 px-1 rounded-xl flex flex-col items-center justify-center gap-1.5 active:scale-95 transition-all shadow-md overflow-hidden">
          <span class="text-xl leading-none"><i class="fa-solid fa-volume-high"></i></span>
          <span class="text-[9px] font-bold tracking-tighter whitespace-nowrap">よみ・こたえ</span>
        </button>

        <!-- ◯ボタン -->
        <button id="btn-correct" onclick="handleAnswer(true)" class="bg-emerald-500 hover:bg-emerald-600 text-white py-3 px-2 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
          <span class="text-4xl font-extrabold leading-none">◯</span>
          <span class="text-xs font-bold" id="label-correct">あってる</span>
        </button>
      </div>
    </div>

    <!-- お子様用メイン表示エリア（画面中央〜下部） -->
    <div class="flex-1 flex flex-col justify-center items-center my-4 relative w-full overflow-hidden min-h-[360px]">
      
      <!-- 背景にいっぱい散りばめられる同じ数字 of different fonts -->

      </div>

      <!-- 手前を向いているメイン表示エリア -->
      <div id="target-display" class="flex flex-col justify-center items-center transition-all duration-300 relative z-10 w-full">
        
        <!-- 立体スロット合体ステージ -->
        <div id="slot-stage" class="hidden relative h-40 md:h-52 flex justify-center items-center select-none mb-4 font-mono">
        </div>

        <!-- 巨大な数字 -->
        <div id="number-text" class="text-[9rem] md:text-[13rem] font-extrabold text-slate-800 leading-none tracking-tight select-none drop-shadow-md transition-transform duration-300 flex justify-center items-center">

          よみかた
        </div>
      </div>
    </div>

  </div>

  <!-- 3. プロトタイプ体験専用画面（案B集中検証） -->
  <div id="proto-screen" class="hidden flex-1 flex flex-col justify-between p-4 bg-slate-100 select-none overflow-y-auto">
    <!-- 上部ヘッダーコントロール -->
    <div class="bg-white rounded-2xl shadow-md p-4 border border-purple-200 mb-4">
      <div class="flex justify-between items-center mb-3">
        <button onclick="exitPrototypePage()" class="text-gray-600 hover:text-gray-800 font-bold text-sm bg-gray-100 hover:bg-gray-200 py-1.5 px-3 rounded-lg flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> もどる
        </button>
        <span class="text-xs font-black px-3 py-1 bg-purple-100 text-purple-800 rounded-full border border-purple-200">
          🧪 案B: 位のお部屋（万の位・フォーカス読み）
        </span>
      </div>

      <!-- 桁ごとのドロップダウン入力＆ポップアップ付きランダム機能 -->
      <div class="flex flex-col gap-3 bg-purple-50 p-3.5 rounded-2xl border border-purple-100">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-purple-900">🔢 5桁の数字をつくる:</span>
          
          <!-- ランダムポップアップ切り替えボタン -->

            <button onclick="toggleRandomMenu()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-1.5 px-3 rounded-xl text-xs shadow transition-all flex items-center gap-1">

            </button>
            
            <!-- 1〜5桁ランダム選択メニュー -->

              <button onclick="setProtoRandomDigit(2)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-gray-700 hover:bg-purple-100">2桁 (10〜99)</button>
              <button onclick="setProtoRandomDigit(3)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-gray-700 hover:bg-purple-100">3桁 (100〜999)</button>
              <button onclick="setProtoRandomDigit(4)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-gray-700 hover:bg-purple-100">4桁 (1000〜9999)</button>
              <button onclick="setProtoRandomDigit(5)" class="w-full text-left px-4 py-1.5 text-xs font-bold text-gray-700 hover:bg-purple-100">5桁 (10000〜99999)</button>
            </div>
          </div>
        </div>

        <!-- 5つの桁のドロップダウン（万・千・百・十・一） -->
        <div class="grid grid-cols-5 gap-1.5">
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-purple-700">万</span>
            <select id="digit-10000" onchange="onProtoDigitChange()" class="w-full bg-white border border-purple-300 rounded-lg p-1 text-center font-black text-gray-800 text-base focus:ring-2 focus:ring-purple-400">
              <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-purple-700">千</span>
            <select id="digit-1000" onchange="onProtoDigitChange()" class="w-full bg-white border border-purple-300 rounded-lg p-1 text-center font-black text-gray-800 text-base focus:ring-2 focus:ring-purple-400">
              <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-purple-700">百</span>
            <select id="digit-100" onchange="onProtoDigitChange()" class="w-full bg-white border border-purple-300 rounded-lg p-1 text-center font-black text-gray-800 text-base focus:ring-2 focus:ring-purple-400">
              <option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-purple-700">十</span>
            <select id="digit-10" onchange="onProtoDigitChange()" class="w-full bg-white border border-purple-300 rounded-lg p-1 text-center font-black text-gray-800 text-base focus:ring-2 focus:ring-purple-400">
              <option value="0">0</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
          <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-purple-700">一</span>
            <select id="digit-1" onchange="onProtoDigitChange()" class="w-full bg-white border border-purple-300 rounded-lg p-1 text-center font-black text-gray-800 text-base focus:ring-2 focus:ring-purple-400">
              <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- 案Bメイン検証ステージ -->
    <div class="flex-1 bg-white rounded-3xl shadow-lg border-2 border-purple-100 p-4 flex flex-col justify-start items-center min-h-[420px] relative overflow-hidden">
      
      <div id="proto-mode-title" class="text-xs font-bold text-purple-700 bg-purple-50 px-4 py-1.5 rounded-full border border-purple-200 mb-4 text-center">
        🏠 案B: 位のお部屋（数字 ➔ 位の言葉フォーカス読み上げ）
      </div>

      <!-- プロトタイプ表示エリア -->
      <div id="proto-stage-area" class="w-full flex-1 flex flex-col items-center justify-center gap-6">

  <!-- 4. 結果発表画面 -->
  <div id="result-screen" class="hidden fixed inset-0 bg-slate-900 bg-opacity-80 backdrop-blur-sm z-50 flex justify-center items-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-4 border-yellow-400 relative overflow-hidden">
      <div class="text-7xl mb-4 text-yellow-500 animate-bounce">
        <i class="fa-solid fa-crown"></i>
      </div>
      <h2 class="text-3xl font-black text-gray-800 mb-2">お勉強おわり！</h2>
      <p class="text-emerald-600 font-bold mb-6 text-lg">たいへんよくできました！💮</p>
      
      <div class="bg-slate-50 p-4 rounded-2xl border border-gray-100 mb-6 text-left space-y-3 text-sm text-gray-600 font-bold">
        <div class="flex justify-between items-center">
          <span>🎯 いっぱつで あたったよ：</span>
          <span class="text-lg text-emerald-600" id="result-perfect">0 / 12</span>
        </div>
        <div class="flex justify-between items-center border-t border-gray-200 pt-2">
          <span>🔄 おさらいで あたったよ：</span>
          <span class="text-lg text-amber-500" id="result-learned">0 / 0</span>
        </div>
      </div>

      <div class="space-y-3">
        <button onclick="restartWithSameSettings()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-extrabold py-3 px-6 rounded-xl text-lg shadow-md transform active:scale-95 transition-all">
          もう一回おなじ範囲で遊ぶ
        </button>
        <button onclick="exitGame()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl text-md transform active:scale-95 transition-all">
          スタート画面に戻る
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-lg font-bold shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    メッセージ
  </div>

  <script>
    // ==========================================
    // アプリケーション設定
    // ==========================================
    const APP_VERSION = "1.13"; // コード変更ごとに0.01追加

    // 状態管理
    let config = {
      min: 1,
      max: 10,
      isFlipped: false
    };

    let state = {
      questions: [],        
      currentIndex: 0,      
      isReviewMode: false,  
      
      wrongNumbers: [],     
      reviewQuestions: [],  
      reviewIndex: 0,       

      firstTryCorrectCount: 0, 
      reviewCorrectCount: 0,   
      totalWrongCount: 0,      
      
      currentNumber: 0,
      isReadingShown: false,
      isTransitioning: false,   

      isAwaitingManualConfirm: false,
      firstInputIsCorrect: null
    };

    // プロトタイプ用状態
    let protoState = {
      isReading: false
    };

    // 安全なタイマー管理
    let activeTimers = [];
    function setSafeTimeout(fn, delay) {
      const timer = setTimeout(() => {
        fn();
        activeTimers = activeTimers.filter(t => t !== timer);
      }, delay);
      activeTimers.push(timer);
      return timer;
    }
    function clearAllTimers() {
      activeTimers.forEach(t => clearTimeout(t));
      activeTimers = [];
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateSessionQuestions(min, max) {
      const pool = [];
      for (let i = min; i <= max; i++) {
        pool.push(i);
      }
      
      let result = [];
      if (pool.length >= 12) {
        const shuffledPool = shuffleArray(pool);
        result = shuffledPool.slice(0, 12);
      } else {
        result = [...pool];
        while (result.length < 12) {
          const randNum = pool[Math.floor(Math.random() * pool.length)];
          result.push(randNum);
        }
        result = shuffleArray(result);
      }
      return result;
    }

    function getDigitDecomposition(num) {
      if (num === 0) {
        return [{
          value: 0,
          label: '0',
          reading: 'れい',
          color: 'bg-slate-100 text-slate-800 border-slate-300'
        }];
      }

      const list = [];
      const numStr = num.toString();
      const len = numStr.length;

      if (len >= 3) {
        const hDigit = parseInt(numStr.charAt(len - 3));
        if (hDigit > 0) {
          const val = hDigit * 100;
          let rd = '';
          if (hDigit === 1) rd = 'ひゃく';
          else if (hDigit === 3) rd = 'さんびゃく';
          else if (hDigit === 6) rd = 'ろっぴゃく';
          else if (hDigit === 8) rd = 'はっぴゃく';
          else {
            const hReadings = {2:'に', 4:'よん', 5:'ご', 7:'なな', 9:'きゅう'};
            rd = hReadings[hDigit] + 'ひゃく';
          }
          list.push({
            value: val,
            label: val.toString(),
            reading: rd,
            color: 'bg-emerald-100 text-emerald-800 border-emerald-300',
            textColor: 'text-emerald-500'
          });
        }
      }

      if (len >= 2) {
        const tDigit = parseInt(numStr.charAt(len - 2));
        if (tDigit > 0) {
          const val = tDigit * 10;
          let rd = '';
          if (tDigit === 1) rd = 'じゅう';
          else {
            const tReadings = {2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
            rd = tReadings[tDigit] + 'じゅう';
          }
          list.push({
            value: val,
            label: val.toString(),
            reading: rd,
            color: 'bg-sky-100 text-sky-800 border-sky-300',
            textColor: 'text-sky-500'
          });
        }
      }

      const oDigit = parseInt(numStr.charAt(len - 1));
      if (oDigit > 0) {
        const oReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        list.push({
          value: oDigit,
          label: oDigit.toString(),
          reading: oReadings[oDigit],
          color: 'bg-rose-100 text-rose-800 border-rose-300',
          textColor: 'text-rose-500'
        });
      }

      return list;
    }

    function getReadingText(num) {
      if (num === undefined || num === null) return '';
      const decomp = getDigitDecomposition(num);
      return decomp.map(item => item.reading).join('');
    }

    function setRange(min, max) {

    function applyFlip() {
      const controlPanel = document.getElementById('control-panel');

    function startGame() {
      clearAllTimers();
      const minInput = parseInt(document.getElementById('min-val').value);
      const maxInput = parseInt(document.getElementById('max-val').value);

      if (isNaN(minInput) || isNaN(maxInput) || minInput > maxInput) {
        showToast("⚠️ はんいを 正しくいれてね");
        return;
      }

      config.min = minInput;
      config.max = maxInput;
      config.isFlipped = document.getElementById('flip-mode').checked;

      state.questions = generateSessionQuestions(config.min, config.max);
      state.currentIndex = 0;
      state.isReviewMode = false;
      state.wrongNumbers = [];
      state.reviewQuestions = [];
      state.reviewIndex = 0;
      
      state.firstTryCorrectCount = 0;
      state.reviewCorrectCount = 0;
      state.totalWrongCount = 0;
      
      state.isTransitioning = true;
      disableActionButtons(true);

      state.isAwaitingManualConfirm = false;
      state.firstInputIsCorrect = null;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('proto-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      document.getElementById('slot-stage').innerHTML = '';
      document.getElementById('slot-stage').classList.add('hidden');
      document.getElementById('number-text').classList.remove('hidden');

      nextQuestion();
    }

        indicator.className = "text-sm font-black px-4 py-1 bg-amber-500 text-white rounded-full border border-amber-600 animate-pulse";
        return;
      }

      if (!state.isReviewMode) {
        indicator.innerText = `もんだい: ${state.currentIndex + 1} / 12`;
        indicator.className = "text-sm font-black px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100";

      const container = document.getElementById('bg-numbers-container');
      container.innerHTML = '';

      const fonts = [
        { class: 'font-sans font-normal' },
        { class: 'font-sans font-bold' },
        { class: 'font-serif font-normal' },
        { class: 'font-serif font-bold' },
        { class: 'font-mono font-normal' },
        { class: 'font-mono font-bold' },
        { style: 'font-family: Impact, sans-serif; font-weight: 900;' },
        { style: 'font-family: Georgia, serif; font-style: italic;' },
        { style: 'font-family: "Courier New", monospace; font-weight: bold;' },
        { style: 'font-family: "Times New Roman", serif; font-style: italic;' },
        { style: 'font-family: "Comic Sans MS", cursive; font-weight: bold;' },
        { style: 'font-family: "Trebuchet MS", sans-serif; font-weight: bold;' },
        { style: 'font-family: "Arial Black", sans-serif;' },
        { style: 'font-family: "Palatino Linotype", serif;' }
      ];

      const numCount = 14;

      for (let i = 0; i < numCount; i++) {

        el.style.left = `${left}%`;

        const size = (Math.random() * 3.5 + 2).toFixed(1);
        el.style.fontSize = `${size}rem`;

        const rotate = Math.floor(Math.random() * 80) - 40;
        el.style.transform = `translate(-50%, -50%) rotate(${rotate}deg)`;

          font.class.split(' ').forEach(cls => el.classList.add(cls));

          el.style.cssText += ';' + font.style;

    function renderColoredMainNumber(num, isColored = false) {
      const container = document.getElementById('number-text');
      container.innerHTML = ''; 
      
      const numStr = num.toString();
      const len = numStr.length;

      for (let i = 0; i < len; i++) {
        const char = numStr.charAt(i);
        const span = document.createElement('span');
        span.innerText = char;
        span.className = "text-slate-800 transition-colors duration-300";

        if (isColored) {
          const currentPosFromRight = len - i;

          if (currentPosFromRight === 3) {
            if (parseInt(char) > 0) {
              span.className = "text-emerald-500 font-black transition-colors duration-300";
            } else {
              span.className = "text-slate-300 font-normal transition-colors duration-300"; 
            }
          } else if (currentPosFromRight === 2) {
            if (parseInt(char) > 0) {
              span.className = "text-sky-500 font-black transition-colors duration-300";
            } else {
              span.className = "text-slate-300 font-normal transition-colors duration-300"; 
            }
          } else if (currentPosFromRight === 1) {
            if (parseInt(char) > 0 || num === 0) {
              span.className = "text-rose-500 font-black transition-colors duration-300";
            } else {
              span.className = "text-slate-300 font-normal transition-colors duration-300"; 
            }
          }
        }

        container.appendChild(span);
      }
    }

    function nextQuestion() {
      state.isReadingShown = false;
      state.isAwaitingManualConfirm = false; 
      
      const readingEl = document.getElementById('reading-text');
      readingEl.classList.add('opacity-0');

      const decompContainer = document.getElementById('decomposition-container');
      decompContainer.innerHTML = '';

      const slotStage = document.getElementById('slot-stage');
      slotStage.innerHTML = '';
      slotStage.classList.add('hidden');

      const numTextEl = document.getElementById('number-text');
      numTextEl.classList.remove('hidden');
      numTextEl.style.transform = 'scale(1)';

      resetActionButtonsUI();

      if (!state.isReviewMode) {
        state.currentNumber = state.questions[state.currentIndex];
      } else {
        state.currentNumber = state.reviewQuestions[state.reviewIndex];
      }
      
      if (state.currentNumber === undefined || state.currentNumber === null) {
        state.isTransitioning = false;
        disableActionButtons(false);
        showResults();
        return;
      }
      
      renderColoredMainNumber(state.currentNumber, false);
      readingEl.innerText = getReadingText(state.currentNumber);
      
      updateProgressUI();
      generateBackgroundNumbers(state.currentNumber);

      state.isTransitioning = false;
      disableActionButtons(false);
    }

    function resetActionButtonsUI() {
      const container = document.getElementById('action-buttons');
      container.className = "grid grid-cols-[9fr_2fr_9fr] gap-3";

      document.getElementById('btn-wrong').classList.remove('hidden');
      document.getElementById('btn-reading').classList.remove('hidden');
      document.getElementById('btn-correct').classList.remove('hidden');

      document.getElementById('label-correct').innerText = "あってる";

    function handleShowReadingButton() {
      if (state.isTransitioning) return; 

      state.firstInputIsCorrect = false; 
      state.isReadingShown = false; 
      showReading(true);

      state.isTransitioning = true;
      disableActionButtons(true);

      setSafeTimeout(() => {
        state.isTransitioning = false;
        disableActionButtons(false);
        
        state.isAwaitingManualConfirm = true;
        updateProgressUI();

        document.getElementById('btn-correct').classList.add('hidden');
        document.getElementById('btn-reading').classList.remove('hidden'); 
        
        const container = document.getElementById('action-buttons');
        container.className = "grid grid-cols-[3fr_7fr] gap-3";

        document.getElementById('label-wrong').innerText = "つぎへ進む";
      }, 2000);
    }

    function showReading(forceSpeech = true) {
      state.isReadingShown = true;

      const readingEl = document.getElementById('reading-text');
      readingEl.classList.remove('opacity-0');

      if (forceSpeech && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(state.currentNumber.toString());
        utterance.lang = 'ja-JP';
        utterance.rate = 0.95; 
        window.speechSynthesis.speak(utterance);
      }
    }

    function handleAnswer(isCorrect) {
      if (state.isTransitioning) return;

      if (!state.isAwaitingManualConfirm) {
        state.isTransitioning = true;
        disableActionButtons(true);

        if (isCorrect) {
          showReading(true);

          setSafeTimeout(() => {
            proceedToNext(true); 
          }, 2000);

        } else {
          setSafeTimeout(() => {
            state.isReadingShown = false;
            showReading(true);

            setSafeTimeout(() => {
              state.isTransitioning = false;
              disableActionButtons(false);
              
              state.isAwaitingManualConfirm = true;
              state.firstInputIsCorrect = false; 
              
              updateProgressUI(); 

              document.getElementById('btn-correct').classList.add('hidden');
              document.getElementById('btn-reading').classList.remove('hidden');

              const container = document.getElementById('action-buttons');
              container.className = "grid grid-cols-[3fr_7fr] gap-3";

              document.getElementById('label-wrong').innerText = "つぎへ進む";
            }, 2000);
          }, 500);
        }
      } else {
        state.isAwaitingManualConfirm = false;
        proceedToNext(state.firstInputIsCorrect);
      }
    }

    function proceedToNext(isCorrect) {
      if (!state.isReviewMode) {
        if (isCorrect) {
          state.firstTryCorrectCount++;
        } else {
          state.totalWrongCount++;
          if (!state.wrongNumbers.includes(state.currentNumber)) {
            state.wrongNumbers.push(state.currentNumber);
          }
        }
        
        state.currentIndex++;
        
        if (state.currentIndex < 12) {
          nextQuestion();
        } else {
          if (state.wrongNumbers.length === 0) {
            state.isTransitioning = false;
            disableActionButtons(false);
            showResults();
          } else {
            startReviewMode();
          }
        }
      } else {
        if (isCorrect) {
          state.reviewCorrectCount++;
        } else {
          state.totalWrongCount++;
        }
        
        state.reviewIndex++;
        
        if (state.reviewIndex < state.reviewQuestions.length) {
          nextQuestion();
        } else {
          state.isTransitioning = false;
          disableActionButtons(false);
          showResults();
        }
      }
    }

    function startReviewMode() {
      state.isReviewMode = true;
      state.reviewQuestions = shuffleArray(state.wrongNumbers);
      state.reviewIndex = 0;
      
      state.isTransitioning = true;
      disableActionButtons(true);
      
      showToast(`🔄 まちがえた ${state.reviewQuestions.length}もん の おさらいいくよ！`);
      
      setSafeTimeout(() => {
        nextQuestion();
      }, 1000);
    }

    function showResults() {
      document.getElementById('result-perfect').innerText = `${state.firstTryCorrectCount} / 12`;
      
      const learnedEl = document.getElementById('result-learned');
      if (state.wrongNumbers.length > 0) {
        learnedEl.innerText = `${state.reviewCorrectCount} / ${state.wrongNumbers.length}`;
        learnedEl.parentElement.classList.remove('hidden');
      } else {
        learnedEl.innerText = "なし (パーフェクト！💮)";
      }
      
      document.getElementById('result-screen').classList.remove('hidden');
    }

    function showToast(message) {

      toast.innerText = message;
      toast.classList.remove('opacity-0');
      
      setSafeTimeout(() => {
        toast.classList.add('opacity-0');
      }, 1800);
    }

    // 日本語数詞発音テーブル（特殊音変化に対応）
    function getDigitReadingPhonetics(digitChar, place) {
      const d = parseInt(digitChar, 10);
      if (d === 0) return { numReading: '', placeReading: '' };

      if (place === '万') {
        const numReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'まん' };
      }
      if (place === '千') {
        if (d === 1) return { numReading: '', placeReading: 'せん' };
        if (d === 3) return { numReading: 'さん', placeReading: 'ぜん' };
        if (d === 8) return { numReading: 'はっ', placeReading: 'せん' };
        const numReadings = {2:'に', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'せん' };
      }
      if (place === '百') {
        if (d === 1) return { numReading: '', placeReading: 'ひゃく' };
        if (d === 3) return { numReading: 'さん', placeReading: 'びゃく' };
        if (d === 6) return { numReading: 'ろっ', placeReading: 'ぴゃく' };
        if (d === 8) return { numReading: 'はっ', placeReading: 'ぴゃく' };
        const numReadings = {2:'に', 4:'よん', 5:'ご', 7:'なな', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'ひゃく' };
      }
      if (place === '十') {
        if (d === 1) return { numReading: '', placeReading: 'じゅう' };
        const numReadings = {2:'机', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: 'じゅう' };
      }
      if (place === '一') {
        const numReadings = {1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご', 6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'};
        return { numReading: numReadings[d], placeReading: '' };
      }
      return { numReading: '', placeReading: '' };
    }

    // 順次フォーカス移動＆読み上げ処理
    function runProtoBFocusSequence(numStr, places) {
      if (protoState.isReading) return;
      protoState.isReading = true;

      const btn = document.getElementById('proto-play-btn');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-50');
      }

      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      // リセット（フォーカス解除）
      for (let i = 0; i < 5; i++) {
        const b = document.getElementById(`proto-box-${i}`);
        const l = document.getElementById(`proto-label-${i}`);
        if (b) b.classList.remove('active-focus-num');
        if (l) l.classList.remove('active-focus-label');
      }

      const placeNames = ['万', '千', '百', '十', '一'];
      const sequence = [];

      // 先頭の無効な「0」をスキップするフラグ
      let hasStarted = false;

      for (let i = 0; i < 5; i++) {
        const char = numStr.charAt(i);
        const d = parseInt(char, 10);
        const placeName = placeNames[i];

        if (d > 0) hasStarted = true;

        if (hasStarted) {
          const phonetics = getDigitReadingPhonetics(char, placeName);
          
          if (phonetics.numReading !== '' || phonetics.placeReading !== '') {
            if (phonetics.numReading !== '') {
              sequence.push({ type: 'num', index: i, speech: phonetics.numReading });
            }
            if (phonetics.placeReading !== '') {
              sequence.push({ type: 'label', index: i, speech: phonetics.placeReading });
            }
          }
        }
      }

      // 全部ゼロ（0）の場合の特別ハンドリング
      if (sequence.length === 0) {
        sequence.push({ type: 'num', index: 4, speech: 'れい' });
      }

      let stepIndex = 0;

      function playNextStep() {
        if (stepIndex >= sequence.length) {
          // 終了時リセット
          setSafeTimeout(() => {
            for (let i = 0; i < 5; i++) {
              const b = document.getElementById(`proto-box-${i}`);
              const l = document.getElementById(`proto-label-${i}`);
              if (b) b.classList.remove('active-focus-num');
              if (l) l.classList.remove('active-focus-label');
            }
            protoState.isReading = false;
            if (btn) {
              btn.disabled = false;
              btn.classList.remove('opacity-50');
            }
          }, 600);
          return;
        }

        const step = sequence[stepIndex];

        // 前のフォーカス解除
        for (let i = 0; i < 5; i++) {
          const b = document.getElementById(`proto-box-${i}`);
          const l = document.getElementById(`proto-label-${i}`);
          if (b) b.classList.remove('active-focus-num');
          if (l) l.classList.remove('active-focus-label');
        }

        // 今回のフォーカス適用
        if (step.type === 'num') {
          const targetBox = document.getElementById(`proto-box-${step.index}`);
          if (targetBox) targetBox.classList.add('active-focus-num');
        } else {
          const targetLabel = document.getElementById(`proto-label-${step.index}`);
          if (targetLabel) targetLabel.classList.add('active-focus-label');
        }

        // 発声
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(step.speech);
          utterance.lang = 'ja-JP';
          utterance.rate = 1.0;
          window.speechSynthesis.speak(utterance);
        }

        stepIndex++;
        setSafeTimeout(playNextStep, 700); // 700ms間隔でリズミカルに移動
      }

      playNextStep();
    }

    // ページロード時設定
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('version-display').innerText = `Ver ${APP_VERSION}`;
    });
  </script>
</body>
